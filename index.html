<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mm9 | Repositório</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-2: #1f2937;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --primary: #60a5fa;
        --secondary: #f59e0b;
        --accent: #34d399;
        --border: rgba(255, 255, 255, 0.08);
        --shadow: 0 20px 55px rgba(0, 0, 0, 0.35);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(96, 165, 250, 0.18), transparent 35%),
          radial-gradient(circle at bottom right, rgba(52, 211, 153, 0.14), transparent 30%),
          var(--bg);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 32px;
      }

      .card {
        width: min(900px, 100%);
        background: rgba(17, 24, 39, 0.95);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .header {
        padding: 28px 30px 18px;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(180deg, rgba(31, 41, 55, 0.8), rgba(17, 24, 39, 0.95));
      }

      .repo-badge {
        display: inline-block;
        background: rgba(96, 165, 250, 0.15);
        color: var(--primary);
        border: 1px solid rgba(96, 165, 250, 0.3);
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      h1 {
        margin: 18px 0 8px;
        font-size: clamp(2rem, 3vw, 3rem);
        line-height: 1.1;
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 1.05rem;
      }

      .content {
        display: grid;
        grid-template-columns: 1.3fr 1fr;
        gap: 24px;
        padding: 28px 30px 30px;
      }

      .panel {
        background: rgba(31, 41, 55, 0.4);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 22px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(150px, 1fr));
        gap: 16px;
        margin-top: 8px;
      }

      .stat {
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px 14px;
      }

      .label {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .value {
        font-weight: 700;
        font-size: 1.1rem;
      }

      .lang-title {
        margin: 0 0 18px;
        font-size: 1.15rem;
      }

      .lang-list {
        display: grid;
        gap: 18px;
      }

      .lang-item {
        display: grid;
        gap: 8px;
      }

      .lang-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.98rem;
      }

      .bar {
        width: 100%;
        height: 12px;
        background: rgba(148, 163, 184, 0.15);
        border-radius: 999px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.05);
      }

      .fill {
        height: 100%;
        border-radius: 999px;
      }

      .js {
        background: linear-gradient(90deg, #facc15, #f59e0b);
      }

      .css {
        background: linear-gradient(90deg, #60a5fa, #2563eb);
      }

      .legend {
        color: var(--muted);
        font-size: 0.92rem;
      }

      @media (max-width: 720px) {
        .content {
          grid-template-columns: 1fr;
        }

        .stats {
          grid-template-columns: 1fr 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <span class="repo-badge">Public Repository</span>
        <h1>mm9</h1>
        <p class="subtitle">@mathias-primero / mm9</p>
      </div>

      <div class="content">
        <section class="panel">
          <h2 style="margin-top: 0;">Informações do repositório</h2>

          <div class="stats">
            <div class="stat">
              <span class="label">Owner</span>
              <span class="value">mathias-primero</span>
            </div>

            <div class="stat">
              <span class="label">Idioma principal</span>
              <span class="value">JavaScript</span>
            </div>

            <div class="stat">
              <span class="label">Branch padrão</span>
              <span class="value">main</span>
            </div>

            <div class="stat">
              <span class="label">Visibilidade</span>
              <span class="value">Public</span>
            </div>

            <div class="stat">
              <span class="label">Issues abertas</span>
              <span class="value">0</span>
            </div>

            <div class="stat">
              <span class="label">ID do repositório</span>
              <span class="value">1408733935</span>
            </div>
          </div>
        </section>

        <section class="panel">
          <h2 class="lang-title">Composição por linguagem</h2>

          <div class="lang-list">
            <div class="lang-item">
              <div class="lang-header">
                <span>JavaScript</span>
                <strong>8,050</strong>
              </div>
              <div class="bar">
                <div class="fill js" style="width: 60%;"></div>
              </div>
              <div class="legend">60%</div>
            </div>

            <div class="lang-item">
              <div class="lang-header">
                <span>CSS</span>
                <strong>5,362</strong>
              </div>
              <div class="bar">
                <div class="fill css" style="width: 40%;"></div>
              </div>
              <div class="legend">40%</div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
